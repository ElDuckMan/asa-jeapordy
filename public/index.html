<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9e7e2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/craft.css"><link rel="stylesheet" href="/css/views.css">
<title>ASA Jeopardy · Sign in</title>
<style>
  .si-head{text-align:center;padding:14px 16px 0;container-type:inline-size}
  .si-head .title{flex-wrap:nowrap;--ts:min(104px,15cqi)}
  .si-head.small .title{--ts:min(44px,9cqi)}
  .si-switch{display:flex;justify-content:center;gap:10px;margin:14px 0 0}
  .si-switch .btn{min-width:140px;font-size:21px}
  .si-host{max-width:460px;margin:12px auto;padding:0 14px}
  .si-host .card{text-align:left}
  .si-player .p-joincard{margin-top:12px}
</style></head>
<body class="vignette">
<header class="si-head" id="head">
  <div class="tape">Asian Student Association presents</div>
  <h1 class="title" id="t"></h1>
  <div class="si-switch" id="switch" role="tablist" aria-label="Sign in as">
    <button class="btn on" data-as="player" role="tab">🙋 Player</button>
    <button class="btn" data-as="host" role="tab">🎛 Host</button>
  </div>
</header>
<main>
  <div class="si-player" id="player"></div>
  <div class="si-host" id="host" hidden></div>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/common.js"></script><script src="/js/fx.js"></script><script src="/js/views.js"></script>
<script src="/js/sample-game.js"></script><script src="/js/play.js"></script>
<script>
(function () {
  const { esc } = Craft;
  Craft.title(document.getElementById('t'), 'Jeopardy!');
  const net = Craft.socketNet();
  const head = document.getElementById('head'), sw = document.getElementById('switch');
  const hostEl = document.getElementById('host'), playerEl = document.getElementById('player');
  const read = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (_) { return null; } };

  /* Player: the phone view, with its own join form (room code, name, team, section). */
  mountPlay(playerEl, net, {
    code: Craft.qs('room') || '',
    onJoin: () => { sw.hidden = true; head.classList.add('small'); },
    onLeave: () => { sw.hidden = false; head.classList.remove('small'); }
  });

  /* Host: PIN only. A correct PIN opens a room and goes to the host panel. */
  function drawHost(err) {
    const saved = read('asa-host');
    hostEl.innerHTML = `<div class="card paper pop"><h2 class="hand">Host sign-in</h2>
      ${saved ? `<p>You're already hosting room <b>${esc(saved.code)}</b>.</p><a class="btn hi" href="/host">Go to the host panel</a><p class="small muted">Or enter the PIN to open a brand-new room.</p>` : '<p>Enter the host PIN to open a game room.</p>'}
      <label class="lbl" for="pin">Host PIN</label>
      <input id="pin" class="field" type="password" inputmode="numeric" autocomplete="current-password">
      <div class="err">${esc(err || '')}</div>
      <button class="btn big hi" id="go">Open game room</button></div>`;
    const pin = document.getElementById('pin');
    const go = () => {
      const settings = read('asa-settings') || undefined;
      net.emit('host:create', { pin: pin.value, game: read('asa-game') || window.SAMPLE_GAME, settings }).then(r => {
        if (r.error) return drawHost(r.error);
        localStorage.setItem('asa-host', JSON.stringify({ code: r.code, token: r.token }));
        location.href = '/host';
      });
    };
    document.getElementById('go').onclick = go;
    pin.onkeydown = e => { if (e.key === 'Enter') go(); };
  }
  function choose(as) {
    sw.querySelectorAll('[data-as]').forEach(b => b.classList.toggle('on', b.dataset.as === as));
    playerEl.hidden = as !== 'player';
    hostEl.hidden = as !== 'host';
    if (as === 'host') { drawHost(Craft.qs('err')); setTimeout(() => { const p = document.getElementById('pin'); if (p) p.focus(); }, 50); }
  }
  sw.addEventListener('click', e => { const b = e.target.closest('[data-as]'); if (b) choose(b.dataset.as); });
  choose(Craft.qs('as') === 'host' ? 'host' : 'player');
})();
</script>
</body></html>
