<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9e7e2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/craft.css"><link rel="stylesheet" href="/css/views.css">
<title>ASA Jeopardy · Sign in</title>
<style>
  .si-head{text-align:center;padding:14px 16px 0;container-type:inline-size}
  .si-head .title{flex-wrap:nowrap;--ts:min(104px,15cqi)}
  .si-head.small .title{--ts:min(44px,9cqi)}
  .si-switch{display:flex;justify-content:center;gap:10px;margin:14px 0 0}
  .si-switch{flex-wrap:wrap}
  .si-switch .btn{min-width:120px;font-size:20px}
  .si-host{max-width:460px;margin:12px auto;padding:0 14px}
  .si-host .pk-wrap{max-width:none}
  #host:has(.pk-wrap){max-width:920px}
  .si-host .card{text-align:left}
  .si-player .p-joincard{margin-top:12px}
</style></head>
<body class="vignette">
<header class="si-head" id="head">
  <div class="tape">Asian Student Association presents</div>
  <h1 class="title" id="t"></h1>
  <div class="si-switch" id="switch" role="tablist" aria-label="Sign in as">
    <button class="btn on" data-as="player" role="tab">🙋 Player</button>
    <button class="btn" data-as="host" role="tab">🎛 Host</button>
    <button class="btn" data-as="screen" role="tab">📺 Big screen</button>
  </div>
</header>
<main>
  <div class="si-player" id="player"></div>
  <div class="si-host" id="host" hidden></div>
  <div class="si-host" id="screen" hidden><div class="card paper pop"><h2 class="hand">Big screen</h2>
    <p>Use this on the computer hooked up to the projector or TV. Type the room code from the host's phone.</p>
    <label class="lbl" for="scode">Room code</label>
    <input id="scode" class="field" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="ABCD">
    <div class="err" id="serr"></div>
    <button class="btn big hi" id="sgo">Show the game</button>
    <p class="small muted">Tip: press F11 for full screen.</p></div></div>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/common.js"></script><script src="/js/fx.js"></script><script src="/js/views.js"></script>
<script src="/js/sample-game.js"></script><script src="/js/packs.js"></script>
<script src="/js/packs/classic.js"></script><script src="/js/packs/standard.js"></script><script src="/js/packs/east-asia.js"></script><script src="/js/packs/south-asia.js"></script><script src="/js/packs/africa.js"></script>
<script src="/js/play.js"></script>
<script>
(function () {
  const { esc } = Craft;
  Craft.title(document.getElementById('t'), 'Jeopardy!');
  const net = Craft.socketNet();
  const head = document.getElementById('head'), sw = document.getElementById('switch');
  const hostEl = document.getElementById('host'), playerEl = document.getElementById('player');
  const read = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (_) { return null; } };

  /* Player: the phone view, with its own join form (room code, name, team, section). */
  mountPlay(playerEl, net, {
    code: Craft.qs('room') || '',
    onJoin: () => { sw.hidden = true; head.classList.add('small'); },
    onLeave: () => { sw.hidden = false; head.classList.remove('small'); }
  });

  /* Host: PIN, then pick a question pack, then the room opens and the host panel loads. */
  let pin = '';
  function drawHost(err) {
    const saved = read('asa-host');
    hostEl.innerHTML = `<div class="card paper pop"><h2 class="hand">Host sign-in</h2>
      ${saved ? `<p>You're already hosting room <b>${esc(saved.code)}</b>.</p><a class="btn hi" href="/host">Go to the host panel</a><p class="small muted">Or enter the PIN to open a brand-new room.</p>` : '<p>Enter the host PIN, then choose which questions to play.</p>'}
      <label class="lbl" for="pin">Host PIN</label>
      <input id="pin" class="field" type="password" inputmode="numeric" autocomplete="current-password">
      <div class="err">${esc(err || '')}</div>
      <button class="btn big hi" id="go">Next: pick questions</button></div>`;
    const pinEl = document.getElementById('pin');
    const go = () => { pin = pinEl.value; if (!pin) return drawHost('Enter the host PIN.'); drawPicker(); };
    document.getElementById('go').onclick = go;
    pinEl.onkeydown = e => { if (e.key === 'Enter') go(); };
    setTimeout(() => pinEl.focus(), 30);
  }
  function drawPicker() {
    const mine = read('asa-mine');
    hostEl.innerHTML = `<div class="card paper pop pk-wrap"><h2 class="hand">Pick the questions</h2>
      <p class="small muted">Every pack has two boards per round (A and B), with Music, Movies &amp; TV, Ancient History and Recent History.</p>
      ${AsaPacks.pickerHTML(esc, { mine, current: read('asa-pack') })}
      <div class="err" id="perr"></div><button class="btn sm" id="back">← Back</button></div>`;
    document.getElementById('back').onclick = () => drawHost();
    hostEl.querySelectorAll('[data-pack]').forEach(b => b.onclick = () => {
      const id = b.dataset.pack;
      const game = id === '__mine' ? mine : AsaPacks.gameFor(id);
      hostEl.querySelectorAll('[data-pack]').forEach(x => { x.disabled = true; });
      b.classList.add('chosen');
      net.emit('host:create', { pin, game, settings: read('asa-settings') || undefined }).then(r => {
        if (r.error) return drawHost(r.error);
        localStorage.setItem('asa-host', JSON.stringify({ code: r.code, token: r.token }));
        localStorage.setItem('asa-game', JSON.stringify(game));
        localStorage.setItem('asa-pack', JSON.stringify(id));
        location.href = '/host';
      });
    });
  }
  const screenEl = document.getElementById('screen'), scode = document.getElementById('scode');
  const showScreen = () => {
    const c = scode.value.trim().toUpperCase();
    if (c.length < 4) { document.getElementById('serr').textContent = 'Enter the 4-letter room code.'; return; }
    net.emit('room:info', { code: c }).then(r => {
      if (r.error) document.getElementById('serr').textContent = r.error;
      else location.href = '/board?room=' + c;
    });
  };
  document.getElementById('sgo').onclick = showScreen;
  scode.onkeydown = e => { if (e.key === 'Enter') showScreen(); };
  function choose(as) {
    sw.querySelectorAll('[data-as]').forEach(b => b.classList.toggle('on', b.dataset.as === as));
    playerEl.hidden = as !== 'player';
    hostEl.hidden = as !== 'host';
    screenEl.hidden = as !== 'screen';
    if (as === 'screen') setTimeout(() => scode.focus(), 50);
    if (as === 'host') { drawHost(Craft.qs('err')); setTimeout(() => { const p = document.getElementById('pin'); if (p) p.focus(); }, 50); }
  }
  sw.addEventListener('click', e => { const b = e.target.closest('[data-as]'); if (b) choose(b.dataset.as); });
  choose(['host', 'screen'].includes(Craft.qs('as')) ? Craft.qs('as') : 'player');
})();
</script>
</body></html>
